<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | The Trends</title>
  <meta name="description" content="The page you are looking for could not be found. Explore premium mobile cases, watch straps, and tech accessories at The Trends.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="apple-touch-icon" href="assets/favicon.svg">

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      --font-main: 'Poppins', sans-serif;
      --bg-dark: #0A0A0A;
      --text-main: #111111;
      --text-muted: #71717A;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: inherit;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: var(--font-main);
      background-color: #FFFFFF;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Navbar */
    .navbar {
      height: 80px;
      background: #FFFFFF;
      border-bottom: 1px solid #E5E5E5;
    }

    .brand-logo-icon {
      height: 38px;
      width: auto;
      object-fit: contain;
    }

    /* 404 Main Area */
    .not-found-wrapper {
      padding: 4rem 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
    }

    .not-found-badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      background: #F4F4F5;
      color: #000000;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-radius: 9999px;
      margin-bottom: 1.5rem;
    }

    .not-found-code {
      font-family: var(--font-main);
      font-size: clamp(5rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 0.9;
      color: #000000;
      letter-spacing: -0.04em;
      margin-bottom: 1.25rem;
    }

    .not-found-title {
      font-family: var(--font-main);
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #000000;
    }

    .not-found-desc {
      font-family: var(--font-main);
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto 2rem auto;
      line-height: 1.6;
    }

    .btn-action-black {
      font-family: var(--font-main);
      background: #000000;
      color: #FFFFFF !important;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }

    .btn-action-black:hover {
      background: #27272A;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .btn-action-outline {
      font-family: var(--font-main);
      background: #FFFFFF;
      color: #000000 !important;
      border: 1.5px solid #E4E4E7;
      padding: 0.75rem 2rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.92rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.25s ease;
    }

    .btn-action-outline:hover {
      background: #F4F4F5;
      border-color: #000000;
    }

    /* Footer */
    .simple-footer {
      padding: 1.5rem;
      border-top: 1px solid #E5E5E5;
      text-align: center;
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 500;
      color: #18181B;
      letter-spacing: -0.01em;
    }
  </style>
</head>

<body>
  <!-- Header -->
  <header class="navbar">
    <div class="container-fluid px-4 px-lg-5 d-flex align-items-center justify-content-between">
      <a class="navbar-brand" href="index.html">
        <img src="assets/logo.png" alt="The Trends" class="brand-logo-icon">
      </a>
      <a href="https://wa.me/918113001959" target="_blank" class="btn-action-black py-2 px-3 fs-6">
        <i class="bi bi-whatsapp"></i> Support
      </a>
    </div>
  </header>

  <!-- 404 Hero Area -->
  <main class="not-found-wrapper">
    <span class="not-found-badge">404 Error</span>
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">Page Not Found</h2>
    <p class="not-found-desc">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>

    <div class="d-flex flex-wrap gap-3 justify-content-center">
      <a href="index.html" class="btn-action-black">
        <i class="bi bi-house-door"></i> Back to Home
      </a>
      <a href="categories.html" class="btn-action-outline">
        <i class="bi bi-grid"></i> Browse Categories
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="simple-footer">
    &copy; 2026 The Trends. All rights reserved.
  </footer>
</body>

</html>
