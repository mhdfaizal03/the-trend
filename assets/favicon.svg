<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Background Shape -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="6"/>
  
  <!-- Logo container with white filter for dark mode pop -->
  <g filter="url(#glow)" transform="translate(56, 56)">
    <image href="data:image/png;base64," width="400" height="400" preserveAspectRatio="xMidYMid meet" style="filter: invert(1) brightness(1.8);"/>
  </g>
</svg>